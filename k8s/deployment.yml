apiVersion: apps/v1
kind: Deployment
metadata:
  name: realworld-app
  labels:
    app: realworld-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realworld-app
  template:
    metadata:
      labels:
        app: realworld-app
    spec:
      containers:
        - name: app
          image: ghcr.io/humberto_lemos/realworld-infra:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: realworld-app-config
            - secretRef:
                name: realworld-app-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '250m'
              memory: '256Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: realworld-app
spec:
  selector:
    app: realworld-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realworld-app-config
data:
  BASE_URL: "/api"
  NODE_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: realworld-app-secret
stringData:
  APP_SECRET: "supersecret"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realworld-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realworld-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
